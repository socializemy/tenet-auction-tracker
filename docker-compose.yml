version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - CHROME_BIN_PATH=/usr/bin/google-chrome
      - DATABASE_URL=sqlite:////app/data/auction_data.db
      - GOOGLE_STREET_VIEW_API_KEY=${GOOGLE_STREET_VIEW_API_KEY}
    volumes:
      # Mount the manual data ingest & database folder for offline parsing / safe sqlite states
      - ./backend/data:/app/data
      # Persist team-uploaded property photos across container rebuilds
      - ./backend/property_photos:/app/property_photos
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Build with empty API URL so Nginx forwards /api requests natively to the backend
        - VITE_API_URL=""
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped
